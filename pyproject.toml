[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vercel-mcp-python"
version = "0.1.0"
description = "Run an MCP Python SDK server (Streamable HTTP) as a Vercel serverless function."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3"]

[tool.setuptools]
packages = ["vercel_mcp"]
